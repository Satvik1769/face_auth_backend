spring.application.name=faceAuthBackend

# DataSource
spring.datasource.url=jdbc:postgresql://localhost:5432/faceauth
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JDBC schema init
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# JWT
app.jwt.secret=CHANGE_ME_USE_A_256BIT_SECRET_IN_PRODUCTION_ENV_VAR
app.jwt.access-token-expiry-minutes=15
app.jwt.refresh-token-expiry-days=30

# Rate limiting (per IP, /auth/login)
app.rate-limit.login.capacity=10
app.rate-limit.login.refill-minutes=1

# Logging — never log passwords or tokens
logging.level.com.example.faceAuthBackend=INFO