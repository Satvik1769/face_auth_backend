spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-test.sql

app.jwt.secret=test_secret_key_must_be_at_least_256_bits_long_for_hmac_sha256_ok
app.jwt.access-token-expiry-minutes=15
app.jwt.refresh-token-expiry-days=30